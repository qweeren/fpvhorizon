name: Build for Sunrise

# Builds fpvhorizon.smod, the Sunrise package (smod/), with Sunrise's own tool, `cargo sunrise-mod`,
# from the SDK of the game build smod/sunrise-mod.toml pins. Push a tag like smod-v1.2.0, or run it
# by hand from the Actions tab to just build (downloadable artifact). Tick "release" to also create
# the smod-v<version> tag on that commit and publish the release.
# The Horizon package (hmod/) has its own workflow, release.yml, and its own v* tags.
on:
  push:
    tags: ["smod-v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Create the smod-v<version> tag and publish the release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/') || inputs.release == true }}
    steps:
      - uses: actions/checkout@v4

      - name: Read manifest
        id: manifest
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import tomllib
          m = tomllib.load(open("smod/sunrise-mod.toml", "rb"))
          print(f"id={m['id']}")
          print(f"version={m['version']}")
          print(f"sunrise={m['native']['sunrise']}")
          EOF

      - name: Check tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "smod-v${{ steps.manifest.outputs.version }}" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version ${{ steps.manifest.outputs.version }} in smod/sunrise-mod.toml"
            exit 1
          fi

      # A published version never changes: refuse to release over an existing tag.
      - name: Check the version is not released yet
        if: github.event_name == 'workflow_dispatch' && inputs.release
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/smod-v${{ steps.manifest.outputs.version }}" > /dev/null; then
            echo "::error::smod-v${{ steps.manifest.outputs.version }} already exists. Raise the version in smod/sunrise-mod.toml first."
            exit 1
          fi

      # smod/ is generated from hmod/, so the two never differ.
      - name: Check smod/ is in sync with hmod/
        run: python3 tools/sync_smod.py --check

      # The tool from the pinned build's own SDK release, installed the way Sunrise's docs say:
      # its signature over SHA256SUMS is checked against Sunrise's release key first.
      - name: Install cargo-sunrise-mod
        run: |
          set -eu
          RELEASE_TAG="sdk-${{ steps.manifest.outputs.sunrise }}"
          BASE=https://github.com/sunrise-org/sunrise/releases/download
          KEY=r53xb3cuafGxZSicLz06KC+xXp9NJdPH8snNmXo5pAc=
          TOOL=tool-x86_64-unknown-linux-gnu.tar.xz
          cd "$(mktemp -d)"
          curl -fsSLO "$BASE/$RELEASE_TAG/$TOOL"
          curl -fsSLO "$BASE/$RELEASE_TAG/SHA256SUMS"
          curl -fsSLO "$BASE/$RELEASE_TAG/SHA256SUMS.sig"
          printf 'horizon release %s\n' "$RELEASE_TAG" | cat - SHA256SUMS > message
          { printf '\060\052\060\005\006\003\053\145\160\003\041\000'; printf '%s' "$KEY" | openssl base64 -d -A; } > key.der
          signed=
          while read -r line || [ -n "$line" ]; do
            printf '%s' "$line" | openssl base64 -d -A > signature
            openssl pkeyutl -verify -rawin -pubin -keyform DER -inkey key.der -in message -sigfile signature > /dev/null 2>&1 && signed=1
          done < SHA256SUMS.sig
          [ -n "$signed" ] || { echo "::error::SHA256SUMS is not signed by Sunrise"; exit 1; }
          grep " $TOOL\$" SHA256SUMS | sha256sum -c -
          tar -xJf "$TOOL"
          install -Dm755 cargo-sunrise-mod "$HOME/.local/bin/cargo-sunrise-mod"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The game links these on Linux, so the build needs their development files.
      - name: Install udev and ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libasound2-dev

      - name: Check
        working-directory: smod
        run: cargo sunrise-mod check

      - name: Build
        working-directory: smod
        run: cargo sunrise-mod build

      - name: SHA-256
        id: hash
        working-directory: smod/target/sunrise-mod
        run: |
          sum=$(sha256sum "${{ steps.manifest.outputs.id }}.smod" | cut -d' ' -f1)
          echo "sha256=$sum" >> "$GITHUB_OUTPUT"
          echo "### ${{ steps.manifest.outputs.id }}.smod" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256: \`$sum\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.manifest.outputs.id }}-smod-${{ steps.manifest.outputs.version }}
          path: smod/target/sunrise-mod/*.smod

      - name: Publish release
        if: env.RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: smod-v${{ steps.manifest.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: FPV Horizon ${{ steps.manifest.outputs.version }} for Sunrise
          files: smod/target/sunrise-mod/*.smod
          prerelease: ${{ startsWith(steps.manifest.outputs.version, '0.') }}
          body: |
            FPV Horizon ${{ steps.manifest.outputs.version }} as a Sunrise mod (`.smod`), the same drone and flight code as the Horizon release of this version.

            Built with `cargo sunrise-mod build` and checked with `cargo sunrise-mod check` against Sunrise build `${{ steps.manifest.outputs.sunrise }}` (Nightly 2026-11-20). The `.smod` holds source: the Sunrise launcher compiles it on your computer for the exact game you run.

            SHA-256 of `${{ steps.manifest.outputs.id }}.smod`: `${{ steps.hash.outputs.sha256 }}`
