name: Build

# Push a tag like v0.9.0 to build fpvhorizon.hmod with Horizon's official tool, check it
# the way the horizon-mods registry does, and attach it to a GitHub Release.
# Run it by hand from the Actions tab to just build and check (downloadable artifact), or
# tick "release" to also create the v<version> tag on that commit and publish the release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Create the v<version> tag and publish the release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/') || inputs.release == true }}
    steps:
      - uses: actions/checkout@v4

      - name: Read manifest
        id: manifest
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import tomllib
          m = tomllib.load(open("hmod/horizon-mod.toml", "rb"))
          print(f"id={m['id']}")
          print(f"version={m['version']}")
          print(f"horizon={m['native']['horizon']}")
          EOF

      - name: Check tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "v${{ steps.manifest.outputs.version }}" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version ${{ steps.manifest.outputs.version }} in hmod/horizon-mod.toml"
            exit 1
          fi

      # A published version never changes: refuse to release over an existing tag.
      - name: Check the version is not released yet
        if: github.event_name == 'workflow_dispatch' && inputs.release
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.manifest.outputs.version }}" > /dev/null; then
            echo "::error::v${{ steps.manifest.outputs.version }} already exists. Raise the version in hmod/horizon-mod.toml first."
            exit 1
          fi

      # cargo-horizon-mod from the exact Horizon commit the manifest pins.
      - uses: actions/cache@v4
        id: tool-cache
        with:
          path: |
            ~/.cargo/bin/cargo-horizon-mod
          key: cargo-horizon-mod-${{ steps.manifest.outputs.horizon }}

      - name: Install cargo-horizon-mod
        if: steps.tool-cache.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/horizon-rust/horizon --rev "${{ steps.manifest.outputs.horizon }}" cargo-horizon-mod

      - name: Build
        working-directory: hmod
        run: cargo horizon-mod build

      - name: Check
        working-directory: hmod
        run: cargo horizon-mod check "target/horizon-mod/${{ steps.manifest.outputs.id }}.hmod"

      - name: SHA-256
        id: hash
        working-directory: hmod/target/horizon-mod
        run: |
          sum=$(sha256sum "${{ steps.manifest.outputs.id }}.hmod" | cut -d' ' -f1)
          echo "sha256=$sum" >> "$GITHUB_OUTPUT"
          echo "### ${{ steps.manifest.outputs.id }}.hmod" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256: \`$sum\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.manifest.outputs.id }}-${{ steps.manifest.outputs.version }}
          path: hmod/target/horizon-mod/*.hmod

      - name: Publish release
        if: env.RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.manifest.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: FPV Horizon ${{ steps.manifest.outputs.version }}
          files: hmod/target/horizon-mod/*.hmod
          prerelease: ${{ startsWith(steps.manifest.outputs.version, '0.') }}
          body: |
            Built with `cargo horizon-mod build` and checked with `cargo horizon-mod check` against Horizon `${{ steps.manifest.outputs.horizon }}`.

            SHA-256 of `${{ steps.manifest.outputs.id }}.hmod`: `${{ steps.hash.outputs.sha256 }}`
          generate_release_notes: true
